global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'backend'
    static_configs:
      - targets: ['backend:8000']

  - job_name: 'user-service'
    static_configs:
      - targets: ['user-service:8001']

  - job_name: 'order-service'
    static_configs:
      - targets: ['order-service:8002']

  - job_name: 'payment-service'
    static_configs:
      - targets: ['payment-service:8003']
